name: Build

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish CloudNeko (GUI)
        run: dotnet publish src/CloudNeko/CloudNeko.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Publish CloudNekoCli
        run: dotnet publish src/CloudNeko.Cli/CloudNeko.Cli.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudNeko-win-x64
          path: publish/
          if-no-files-found: error
