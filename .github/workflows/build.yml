name: Build

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write # потрібно для створення тегу й релізу

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish CloudNeko (GUI)
        run: dotnet publish src/CloudNeko/CloudNeko.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Publish CloudNekoCli
        run: dotnet publish src/CloudNeko.Cli/CloudNeko.Cli.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudNeko-win-x64
          path: publish/
          if-no-files-found: error

      - name: Compute version
        id: version
        shell: pwsh
        run: |
          $version = "0.1.${{ github.run_number }}"
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Zip release archive
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath CloudNeko-win-x64.zip

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: CloudNeko ${{ steps.version.outputs.version }}
          files: CloudNeko-win-x64.zip
